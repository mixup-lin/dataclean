; ============================================================
; DataClean pytest 配置
; ============================================================
; 仅约束测试发现与告警策略；覆盖率默认关闭，避免每次运行都拖慢。
[pytest]
testpaths = tests

; --strict-markers：未注册的自定义 marker 直接报错，避免拼写错误被静默忽略。
addopts = --strict-markers -ra

; 自定义 marker 声明（现有用例只使用内置 parametrize/skipif；real_llm 供
; 显式开启在线模型用例时标记，默认不运行，见 tests/test_prompt_engineering.py）。
markers =
    real_llm: 需要真实 LLM key、默认不运行的在线用例

; 覆盖率不写入 addopts。需要统计时手动追加：
;   pytest -q --cov=ops --cov=rules --cov-report=term-missing
; 依赖在 requirements-dev.txt（pytest-cov + coverage）。

; 告警策略保持宽松：只忽略常见弃用噪声，不把任何 warning 升级为 error，
; 避免第三方库告警导致用例失败。
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
